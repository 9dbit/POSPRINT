<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POSPRINT Admin</title><link rel="stylesheet" href="/styles.css"></head><body><div class="topbar"><div><span class="brand">POSPRINT</span> <span class="muted">Internal Admin</span></div><nav><a href="/admin">Admin</a><a href="/operator">Operator</a></nav></div><main class="wrap"><section class="grid cards" id="cards"></section><section class="split"><div class="panel"><h2>Create paid order</h2><div class="form-grid"><div><label>Customer</label><input id="customer" placeholder="Nama customer"></div><div><label>Phone</label><input id="phone" placeholder="08..."></div><div><label>Product</label><select id="product"></select></div><div><label>Qty</label><input id="qty" type="number" min="0.001" step="0.001" value="1"></div></div><h3>Add-on finishing</h3><div id="addons" class="checkbox-grid"></div><div class="toolbar" style="margin-top:14px"><button class="btn green" id="createOrder">Create & mark paid</button><span id="estimate" class="muted"></span></div></div><div class="panel"><h2>Add product</h2><div class="form-grid"><div><label>SKU</label><input id="sku"></div><div><label>Name</label><input id="pname"></div><div><label>Material category</label><input id="material" placeholder="Art Paper"></div><div><label>Machine category</label><input id="machine" placeholder="Digital Press"></div><div><label>Unit</label><input id="unit" value="pcs"></div><div><label>Cost price</label><input id="cost" type="number"></div><div><label>Sell price</label><input id="sell" type="number"></div><div><label>Opening stock</label><input id="stock" type="number"></div></div><button class="btn" id="addProduct" style="margin-top:12px">Save product</button></div></section><section class="panel"><h2>Orders</h2><div class="table-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th><th>Est. Cost</th><th>Gross</th><th>Created</th></tr></thead><tbody id="orders"></tbody></table></div></section><section class="panel"><h2>Inventory</h2><div class="table-wrap"><table><thead><tr><th>SKU</th><th>Product</th><th>Material</th><th>Machine</th><th>Stock</th><th>Min</th><th>Sell</th></tr></thead><tbody id="inventory"></tbody></table></div></section></main><script src="/admin.js"></script></body></html>
